services:
  api:
    build: .
    image: availability-api:latest
    ports:
      - "${HOST_PORT:-8000}:8000"
    environment:
      # 容器内监听端口；宿主机映射端口由 HOST_PORT 控制
      APP_PORT: "8000"
      TZ: "UTC"
      # SQLite 数据库文件路径（容器内）；默认放在下方挂载的命名卷 /data 上
      RESERVATIONS_DB_PATH: "${RESERVATIONS_DB_PATH:-/data/reservations.db}"
    volumes:
      # 命名卷持久化 SQLite 数据库，容器重建后预约数据不丢失
      - reservations-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s

volumes:
  reservations-data:
